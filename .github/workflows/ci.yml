name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        # rustfmt only parses, so it safely covers the whole workspace.
        run: cargo fmt --all -- --check

      - name: Clippy (GUI-independent crates)
        run: cargo clippy -p vault-core -p spooky-pass-app-core -p spooky-pass-native-host --all-targets -- -D warnings

      - name: Test (GUI-independent crates)
        # The Tauri crate (spooky-pass-app) needs a webview toolchain and is
        # compiled in the `gui` job; select crates explicitly so this job never
        # tries to build it. Cap parallelism for the 64 MiB Argon2 KDF.
        run: cargo test -p vault-core -p spooky-pass-app-core -p spooky-pass-native-host -- --test-threads=2

  frontend-types:
    name: frontend (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: crates/app/ui
        run: npm ci
      - name: Type-check
        working-directory: crates/app/ui
        run: npm run typecheck
      - name: Lint
        working-directory: crates/app/ui
        run: npm run lint

  extension:
    name: extension (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: extension
        run: npm ci
      - name: Type-check
        working-directory: extension
        run: npm run typecheck
      - name: Lint
        working-directory: extension
        run: npm run lint
      - name: Build
        working-directory: extension
        run: npm run build

  gui:
    name: gui (Tauri shell build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (produces ui/dist for tauri-build)
        working-directory: crates/app/ui
        run: |
          npm ci
          npm run build

      - name: Check the Tauri shell compiles
        run: cargo check -p spooky-pass-app

  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    # Informational for now: surfaces RUSTSEC advisories without blocking the
    # merge. Promote to a required check once the advisory baseline is stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
