[package]
name = "spooky-pass-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Spooky-Pass desktop application (Tauri shell)."

# The Tauri shell binary. Named `spooky-pass` so the produced executable is
# `spooky-pass` rather than the crate name.
[[bin]]
name = "spooky-pass"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
spooky-pass-app-core = { path = "../app-core" }
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# Phase 3: the Core hosts the autofill IPC server (local socket) the native-host
# relays to.
interprocess.workspace = true

# Unix-only: set the autofill socket's file mode to 0600 (owner-only).
[target.'cfg(unix)'.dependencies]
libc.workspace = true
